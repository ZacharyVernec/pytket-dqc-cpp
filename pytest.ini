[pytest]
# Vendored upstream suite. Run from the repository root so that the relative
# fixture paths (`tests/test_circuits/...`, as written upstream) resolve.
testpaths = tests
python_files = *_test.py test_*.py
markers =
    high_compute: marks tests as requiring high compute power (deselect with '-m "not high_compute"')
filterwarnings =
    # Expected by design: features delegated to the reference `pytket_dqc`
    # implementation (see README, "Runtime dependency on the reference package").
    # Each `_delegation.warn_once` message ends with this sentence.
    ignore:.*is not ported to the C\+\+ core; delegating to the reference.*:UserWarning
    # Expected by design: `Annealing.allocate(seed=...)` called without an
    # explicit `initial_place_method` (the default `Random()` is unseeded).
    # Matched after the "Annealing:" prefix because a colon is not allowed
    # inside a `filterwarnings` message regex.
    ignore:.*default Random\(\) initializer.*:UserWarning
    # Third-party: pyzx docstrings contain invalid escape sequences, reported
    # as DeprecationWarning on Python 3.11 (SyntaxWarning on 3.12+). Harmless
    # and outside our control. The module part must be `.*pyzx.*`: these fire
    # while the source is compiled, so warnings matches it against the file
    # path, not the module name.
    ignore:invalid escape sequence.*:DeprecationWarning:.*pyzx.*
    ignore:invalid escape sequence.*:SyntaxWarning:.*pyzx.*
