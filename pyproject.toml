[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "pytket-dqc-cpp"
version = "0.0.2"
description = "Re-implementation of Pytket-DQC into C++"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "pytket-dqc",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.sources]
pytket-dqc = { git = "https://github.com/CQCL/pytket-dqc.git", rev = "1ac175ed820ac02366b2ed71b653d5b96fc72ff7" }

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/pytket_dqc_cpp"]
cmake.version = ">=3.20"
sdist.include = ["cpp/**", "python/**", "CMakeLists.txt", "pytest.ini"]

[tool.scikit-build.cmake.define]
DQC_BUILD_BINDINGS = "ON"
DQC_BUILD_TESTS = "OFF"
